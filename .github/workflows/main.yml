name: Window 10
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
    - name: Enable TS
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        Write-Host "✅ RDP Enabled"
    - name: Set Password
      run: |
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)
        Write-Host "✅ Password Configured"
    - name: Install SSH Client
      run: |
        Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0
    - name: Start Pinggy Tunnel
      run: |
        Write-Host "============================================"
        Write-Host " PINGGY TUNNEL - LOOK FOR THE URL BELOW"
        Write-Host "============================================"
        ssh -tt -p 443 -o StrictHostKeyChecking=no -R0:127.0.0.1:3389 tcp@free.pinggy.io
      timeout-minutes: 350
    - name: Keep Alive
      if: always()
      run: |
        while ($true) {
          Start-Sleep -Seconds 3600
          Write-Host "Still alive... $(Get-Date)"
        }
