name: Windows RDP via Serveo

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Create User 123 and Configure RDP
      shell: powershell
      run: |
        # 1. Disable Password Policy & Create User 123
        secedit /export /cfg C:\secpol.cfg
        (Get-Content C:\secpol.cfg) -Replace "PasswordComplexity = 1", "PasswordComplexity = 0" `
                                     -Replace "MinimumPasswordLength = 6", "MinimumPasswordLength = 1" `
                                     | Set-Content C:\secpol.cfg
        secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
        Remove-Item C:\secpol.cfg -Force
        net user "123" "123" /add
        net localgroup "Administrators" "123" /add
        net localgroup "Remote Desktop Users" "123" /add

        # 2. Enable RDP & Disable NLA (Crucial for TV apps)
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
        Set-Service -Name TermService -StartupType Automatic
        Start-Service -Name TermService

    - name: Start Serveo Tunnel
      shell: powershell
      run: |
        Write-Host "================ RDP IS READY ================"
        Write-Host "Username : 123"
        Write-Host "Password : 123"
        Write-Host "=============================================="
        Write-Host "Look below for the 'Forwarding TCP connections from serveo.net:XXXXX' line"
        
        # The fix: use -R 0 for a random port
        ssh -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net
