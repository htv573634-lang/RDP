name: Windows RDP Server via Tailscale

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Disable Password Policy & Create User 123
      shell: powershell
      run: |
        secedit /export /cfg C:\secpol.cfg
        (Get-Content C:\secpol.cfg) -Replace "PasswordComplexity = 1", "PasswordComplexity = 0" `
                                     -Replace "MinimumPasswordLength = 6", "MinimumPasswordLength = 1" `
                                     | Set-Content C:\secpol.cfg
        secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
        Remove-Item C:\secpol.cfg -Force
        net user "123" "123" /add
        net localgroup "Administrators" "123" /add
        net localgroup "Remote Desktop Users" "123" /add
        echo "RDP_USER=123" >> $env:GITHUB_ENV
        echo "RDP_PASS=123" >> $env:GITHUB_ENV

    - name: Enable RDP & Disable NLA
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
        Set-Service -Name TermService -StartupType Automatic
        Start-Service -Name TermService

    - name: Connect to Tailscale
      uses: tailscale/github-action@v4
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
        args: --unattended --accept-routes

    - name: Get Tailscale IP
      shell: powershell
      run: |
        $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
        echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

    - name: Display Connection Details and Keep Alive
      shell: powershell
      run: |
        Write-Host "================ RDP IS READY ================"
        Write-Host "IP Address: ${{ env.TAILSCALE_IP }}"
        Write-Host "Username : ${{ env.RDP_USER }}"
        Write-Host "Password : ${{ env.RDP_PASS }}"
        Write-Host "=============================================="
        while ($true) { Start-Sleep 300 }
