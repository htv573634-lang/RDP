name: Windows RDP Server via Tailscale

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Configure RDP Service & Create User 123
      shell: powershell
      run: |
        # Enable RDP and Firewall
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        # CRITICAL: Disable NLA and Lower Security Layer for older Android TV clients
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

        # Create user '123' with password '123'
        net user "123" "123" /add
        net localgroup "Administrators" "123" /add
        net localgroup "Remote Desktop Users" "123" /add

        # Export credentials for the log step
        echo "RDP_USER=123" >> $env:GITHUB_ENV
        echo "RDP_PASS=123" >> $env:GITHUB_ENV

    - name: Install and Connect Tailscale
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
        Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/S" -Wait
        
        # Connect to your Tailnet using the secret we will set up next
        & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=github-runner-$env:GITHUB_RUN_ID
        
        # Wait for the IP to be assigned
        $tsIP = $null
        for ($i=1; $i -le 15; $i++){ 
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          if($tsIP){break} 
          Start-Sleep 4 
        }
        if (-not $tsIP) { exit 1 }
        echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

    - name: Display Connection Details and Keep Alive
      shell: powershell
      run: |
        Write-Host "================ RDP IS READY ================"
        Write-Host "IP Address: ${{ env.TAILSCALE_IP }}"
        Write-Host "Username : ${{ env.RDP_USER }}"
        Write-Host "Password : ${{ env.RDP_PASS }}"
        Write-Host "=============================================="
        # Keep the runner alive until the 6-hour limit
        while ($true) { Start-Sleep 300 }
