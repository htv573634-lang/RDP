name: Window 10
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
    - name: Enable TS
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        Write-Host "✅ RDP Enabled"
    - name: Set Password
      run: |
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)
        Write-Host "✅ Password Configured"
    - name: Install SSH Client
      run: |
        Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0
    - name: Start Pinggy Tunnel
      run: |
        $sshCommand = "ssh -p 443 -o StrictHostKeyChecking=no -R0:127.0.0.1:3389 tcp@free.pinggy.io"
        $proc = Start-Process -FilePath "ssh" -ArgumentList "-p 443 -o StrictHostKeyChecking=no -R0:127.0.0.1:3389 tcp@free.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log" -NoNewWindow -PassThru
        Start-Sleep -Seconds 20
        Write-Host "============================================"
        Write-Host " PINGGY TUNNEL INFO"
        Write-Host "============================================"
        if (Test-Path "pinggy_err.log") {
          Get-Content "pinggy_err.log"
        }
        if (Test-Path "pinggy.log") {
          Get-Content "pinggy.log"
        }
        Write-Host "============================================"
        Write-Host " USERNAME: runneradmin"
        Write-Host " PASSWORD: P@ssw0rd!"
        Write-Host "============================================"
    - name: Keep Alive
      run: |
        Write-Host "RDP is running. Keep this workflow alive."
        while ($true) {
          Start-Sleep -Seconds 3600
          Write-Host "Still alive... $(Get-Date)"
        }
